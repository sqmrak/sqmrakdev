<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%(name)s</title>
<link rel="icon" href="icon.png">
<style>
  :root {
    color-scheme: light dark;
    --tint: %(tint)s; --tint-soft: %(tint_soft)s; --tint-deep: %(tint_deep)s;
    --bg: #f2f5fb; --card: #ffffff; --ink: #101828; --dim: #6c7a93;
    --line: rgba(16,24,40,0.09);
  }
  body {
    margin: 0; padding: 20px 16px 36px;
    font: 15px/1.5 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .head img {
    width: 62px; height: 62px; border-radius: 15px; flex: none;
    box-shadow: 0 5px 15px rgba(21,61,150,0.18);
  }
  h1 { font-size: 21px; margin: 0 0 2px; letter-spacing: -0.2px; }
  .version { color: var(--tint); font-weight: 600; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px;
       color: var(--dim); margin: 24px 0 8px; font-weight: 600; }
  p { margin: 0 0 12px; }
  .panel { background: var(--card); border: 1px solid var(--line);
           border-radius: 16px; padding: 4px 15px; }
  table { width: 100%%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 0; vertical-align: top;
           border-bottom: 1px solid var(--line); font-weight: 400; }
  th { color: var(--dim); width: 40%%; }
  td { color: var(--ink); }
  tr:last-child th, tr:last-child td { border-bottom: 0; }
  pre { white-space: pre-wrap; word-wrap: break-word; margin: 0; padding: 13px 0;
        font: 13px/1.55 ui-monospace, Menlo, monospace; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0e1a; --card: #131a2b; --ink: #eef2fb; --dim: #8c9ab5;
      --line: rgba(255,255,255,0.09);
    }
  }
</style>
<div class="head">
  <img src="icon.png" alt="">
  <div>
    <h1>%(name)s</h1>
    <p class="version">%(version)s</p>
  </div>
</div>
%(desc)s<h2>Details</h2>
<div class="panel">
<table>
%(table)s
</table>
</div>
