<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Senko</title>
<link rel="icon" href="icon.png">
<style>
  * { box-sizing: border-box; }
  body { max-width: 680px; margin: 0 auto; padding: 20px 16px 40px; background: #f3f5fc; color: #1b2031; font: 15px/1.5 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .head { min-height: 120px; overflow: hidden; padding: 24px; border-radius: 28px 28px 8px 28px; background: #dce7ff; }
  .head img { float: left; width: 72px; height: 72px; margin-right: 18px; border-radius: 20px; }
  h1 { margin: 4px 0 3px; color: #152753; font-size: 25px; line-height: 1.2; letter-spacing: -.03em; overflow-wrap: break-word; }
  .version { margin: 0; color: #1b3e93; font-weight: 700; }
  .description { margin: 10px 0 0; padding: 20px 24px; border-radius: 8px 8px 24px 24px; background: #e9edfa; color: #3b4b67; }
  .description p { margin: 0; }
  .description:empty { display: none; }
  h2 { margin: 28px 0 12px; color: #273750; font-size: 20px; letter-spacing: -.02em; }
  .panel { padding: 4px 20px; border-radius: 24px; background: #fff; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 0; border-bottom: 1px solid #e6eaf2; text-align: left; vertical-align: top; font-weight: 400; overflow-wrap: break-word; word-break: break-word; }
  th { width: 38%; padding-right: 12px; color: #667389; }
  tr:last-child th, tr:last-child td { border-bottom: 0; }
  @media (prefers-color-scheme: dark) {
    body { background: #111522; color: #e6e9f4; }
    .head { background: #24395f; }
    h1 { color: #e5edff; }
    .version { color: #b1c6ff; }
    .description { background: #202b42; color: #c2d2f0; }
    h2 { color: #e1e7f5; }
    .panel { background: #202737; }
    th { color: #b5c0d4; }
    th, td { border-color: #394154; }
  }
</style>
</head>
<body>
<div class="head">
  <img src="icon.png" alt="">
  <h1>Senko</h1>
  <p class="version">4.2.0-stable</p>
</div>
<div class="description"><p>vless/amnezia client for iOS 4.3+</p>
</div>
<h2>Details</h2>
<div class="panel">
<table>
  <tr><th>Version</th><td>4.2.0-stable</td></tr>
  <tr><th>Size</th><td>21.6 MB</td></tr>
  <tr><th>Developer</th><td>sqmrak</td></tr>
  <tr><th>Section</th><td>Networking</td></tr>
  <tr><th>Identifier</th><td>com.senko.daemon</td></tr>
  <tr><th>Compatibility</th><td>firmware (&gt;= 4.3)</td></tr>
</table>
</div>
</body>
</html>
